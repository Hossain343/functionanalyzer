name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Only real errors stop the build (infos/warnings are allowed).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Checks the exact textbook examples (g(-2)=22, a=-1, ranges, notations ...)
      - run: flutter test

      # ساخت خودکار پوشه و فایل‌های پلتفرم اندروید
      - run: flutter create . --platforms=android

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: function-analyzer-apk
          path: build/app/outputs/flutter-apk/app-release.apk