name: Build Wear OS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-wear-apk:
    name: Build math a Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            mkdir -p /tmp/fa_backup
            cp -r lib /tmp/fa_backup/lib
            cp pubspec.yaml /tmp/fa_backup/pubspec.yaml
            if [ -d "test" ]; then
              cp -r test /tmp/fa_backup/test
            fi
            flutter create --project-name function_analyzer --platforms=android .
            rm -rf lib test
            cp -r /tmp/fa_backup/lib ./lib
            cp /tmp/fa_backup/pubspec.yaml ./pubspec.yaml
            if [ -d "/tmp/fa_backup/test" ]; then
              cp -r /tmp/fa_backup/test ./test
            fi
          fi
          rm -f test/widget_test.dart

      - name: Apply Wear OS AndroidManifest and minSdk 26
        run: |
          if [ -f "wear_config/AndroidManifest.xml" ]; then
            cp wear_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          python3 - <<'EOF'
          import os, re

          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"

          if os.path.exists(kts):
              with open(kts, "r", encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 26", text)
              text = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 26", text)
              with open(kts, "w", encoding="utf-8") as f:
                  f.write(text)
          elif os.path.exists(groovy):
              with open(groovy, "r", encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 26", text)
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 26", text)
              with open(groovy, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Dart unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Wear OS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-a-WearOS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
